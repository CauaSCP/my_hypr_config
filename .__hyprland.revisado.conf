autogenerated = 0
__revisado = 1

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menuKl = rofi -show

bind = $mainMod, Q, exec, $terminal
bind = $mainMod Shift, Q, killactive,
bind = $mainMod Alt, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menuKl run

bind = $mainMod Control, R, exec, $menuKl drun

bind = $mainMod, A, exec, $menuKl drun